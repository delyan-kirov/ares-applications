<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ares, a tour</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/serif.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/mono.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* The typefaces, subset from nix packages by web/build.ts. */
  @font-face { font-family: "Cinzel"; src: url(fonts/cinzel-bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Source Serif 4"; src: url(fonts/serif.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Source Serif 4"; src: url(fonts/serif-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: "Source Serif 4"; src: url(fonts/serif-semibold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Go Mono"; src: url(fonts/mono.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Go Mono"; src: url(fonts/mono-bold.woff2) format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Go Mono"; src: url(fonts/mono-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }

  :root {
    --bg: #16181d; --panel: #1e2128; --card: #191c22; --ink: #e6e6e6;
    --dim: #8b93a1; --ok: #7bd88f; --err: #ff6b6b;
    /* The logo's colors: gold for text and highlights, crimson to act on. */
    --accent: #e8b54c; --gold: #d9a43e; --crimson: #c42a3b;
    --line: #2a2e37; --kw: #c8a6ff;
    --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
    --mono: "Go Mono", "Courier Prime", "Courier New", monospace;
    /* Liquid glass: a frosted, tinted pane that lets the spears show through
       blurred, lit from above by a specular rim. */
    --glass: rgba(26, 28, 35, .42);
    --glass-deep: rgba(14, 15, 20, .62);
    --glass-rim: rgba(255, 255, 255, .09);
    --glass-blur: blur(18px) saturate(170%);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 17px/1.6 var(--serif);
  }
  /* The flying spears (src/spears.ts), behind everything; the glass panels
     blur them where text sits. */
  .spears {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;
  }
  /* A Run's spear crosses in front of the page, under the output cards. */
  .spears.front { z-index: 25; }
  .glass {
    position: relative;
    background: linear-gradient(160deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 38%), var(--glass);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-rim); border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 -1px 0 rgba(0, 0, 0, .25),
      0 18px 40px rgba(0, 0, 0, .35);
  }

  header {
    padding: 40px 20px 30px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: clamp(16px, 4vw, 34px); flex-wrap: wrap;
    max-width: 1080px; margin: 0 auto;
  }
  .mark {
    width: clamp(88px, 17vw, 150px); aspect-ratio: 1; flex: none; cursor: pointer;
    background: radial-gradient(closest-side, rgba(196, 42, 59, .22), transparent);
  }
  .mark svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .mark .shield { transform-origin: .5px .575px; }
  .mark.in .spear { animation: spear-in .75s cubic-bezier(.3, 1.4, .5, 1) backwards; }
  .mark.in .shield { animation: shield-hit .6s ease-out .45s; }
  @keyframes spear-in {
    from { transform: translateY(-1.1px); opacity: 0; }
    35% { opacity: 1; }
  }
  @keyframes shield-hit {
    20% { transform: rotate(-7deg) scale(.97); }
    55% { transform: rotate(4deg); }
    80% { transform: rotate(-1.5deg); }
  }
  header .title { flex: 1; min-width: 0; }
  header h1 {
    margin: 0; color: var(--accent); line-height: 1;
    font: 700 clamp(46px, 10vw, 88px)/1 "Cinzel", var(--serif);
    letter-spacing: .1em;
  }
  header .tag { margin: 10px 0 0 3px; color: var(--dim); font-size: 18px; font-style: italic; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; align-self: flex-start; }
  header a:hover { text-decoration: underline; }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 20px 80px; }
  .intro { color: var(--dim); font-size: 16.5px; margin: 26px 0 30px; padding: 16px 22px; }
  .intro strong { color: var(--ink); font-weight: 600; }

  .cell { margin: 0 0 30px; padding: 18px 20px 20px; }
  .cell .prose { margin: 0 2px 14px; }
  .cell .prose h2 {
    font-size: 21px; font-weight: 600; margin: 0 0 4px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .cell .prose h2 .n {
    color: var(--accent); font-family: var(--mono); font-weight: 400; font-size: 13px;
  }
  .cell .prose p { margin: 0; color: var(--dim); max-width: 74ch; }

  .pane {
    display: flex; flex-direction: column; background: var(--glass-deep); min-width: 0;
    border: 1px solid var(--glass-rim); border-radius: 12px; overflow: hidden;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
  }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid var(--glass-rim); background: rgba(255, 255, 255, .035);
  }
  .bar .label { color: var(--dim); font-size: 12px; font-style: italic; letter-spacing: .3px; }
  .bar .spacer { flex: 1; }
  button {
    font: inherit; font-size: 14px; color: var(--ink); background: rgba(255, 255, 255, .06);
    border: 1px solid var(--glass-rim); border-radius: 8px; padding: 3px 11px; cursor: pointer;
  }
  button.run {
    background: linear-gradient(180deg, #f0c766, var(--gold)); color: #241803;
    border-color: #f3cf7a; font-weight: 600;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 2px 10px rgba(217, 164, 62, .25);
  }
  button.run:hover:not(:disabled) { filter: brightness(1.15); }
  button:disabled { opacity: .5; cursor: default; }
  .ed-view, .ed-input {
    margin: 0; padding: 13px 14px; border: 0;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.6;
    background: transparent; color: var(--ink); tab-size: 4;
    font-variant-ligatures: none;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
  }

  /* The editor: a transparent textarea over a <pre> drawing the same text. */
  .ed { display: flex; flex-direction: column; min-width: 0; }
  .ed-inner { position: relative; }
  .ed-view { min-height: 64px; pointer-events: none; }
  .ed-input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    resize: none; outline: none; overflow: hidden;
    color: transparent; caret-color: var(--ink); -webkit-text-fill-color: transparent;
  }
  .ed-input::selection { background: rgba(217, 164, 62, .3); -webkit-text-fill-color: transparent; }
  .t-keyword { color: var(--kw); }
  .t-comment { color: #6c7686; font-style: italic; }
  .t-string { color: #a5d6a7; }
  .t-number { color: #f6c177; }
  .t-operator { color: #89ddff; }
  .t-type { color: #7cc4ff; }
  .t-function { color: #e6e6e6; }
  .t-macro { color: #ff9e64; }
  .d { text-decoration-line: underline; text-decoration-style: wavy; text-decoration-skip-ink: none;
       text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .d-error { text-decoration-color: var(--err); }
  .d-error.d-focus { text-decoration-thickness: 2px; background: rgba(255, 107, 107, .12); }
  .d-warning { text-decoration-color: #e5c07b; }
  .d-info { text-decoration-color: #6c9bd2; text-decoration-style: dotted; }
  .d-hint { text-decoration: none; }

  .ed-problems { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .ed-problems li {
    padding: 4px 14px; border-top: 1px solid var(--line); cursor: pointer;
    color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ed-problems li:hover { background: #20242c; }
  .ed-problems .p-error { color: var(--err); }
  .ed-problems .p-focus { font-weight: 600; }
  .ed-problems .p-warning { color: #e5c07b; }
  .ed-problems .p-at { font-family: var(--mono); color: var(--dim); font-weight: 400; margin-right: 6px; }
  .check { font-size: 11.5px; color: var(--dim); }
  .check.ok { color: var(--ok); }
  .check.bad { color: var(--err); }

  /* Hover and completion panels, positioned by the editor. */
  .float {
    position: fixed; z-index: 10; max-width: min(560px, calc(100vw - 16px));
    background: rgba(30, 33, 41, .82); border: 1px solid var(--glass-rim); border-radius: 10px;
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45); font-size: 13px;
  }
  .tip { padding: 8px 10px; }
  .tip pre { margin: 0; font-family: var(--mono); color: var(--accent); white-space: pre-wrap; }
  .tip p { margin: 6px 0 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; }
  .tip pre + p, .tip p:first-child { margin-top: 0; }
  .tip pre + p { margin-top: 8px; }
  .tip .m-error { color: var(--err); }
  .tip .m-warning { color: #e5c07b; }
  .tip .m-info { color: var(--dim); }
  .tip button { display: block; margin-top: 6px; text-align: left; }
  .complete { list-style: none; margin: 0; padding: 4px 0; max-height: 240px; overflow-y: auto; min-width: 220px; }
  .complete li {
    display: flex; gap: 14px; justify-content: space-between; padding: 2px 10px;
    font-family: var(--mono); font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .complete li b { font-weight: 500; color: var(--ink); }
  .complete li span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .complete li.sel { background: #2f3644; }

  /* Output cards, one per cell: dropped anywhere, docked at an edge, or thrown away. */
  .card-pos {
    position: fixed; left: 0; top: 0; z-index: 30;
    width: min(620px, calc(100vw - 24px));
  }
  .edge-hint { position: fixed; z-index: 29; pointer-events: none; opacity: 0;
    transition: opacity .15s, background-color .15s; background: var(--accent); }
  .edge-hint.on { opacity: .55; box-shadow: 0 0 24px 6px rgba(232, 181, 76, .35); }
  .edge-hint.out { background: var(--err); box-shadow: 0 0 24px 6px rgba(255, 107, 107, .4); }
  .edge-hint.left { left: 0; top: 0; bottom: 0; width: 4px; }
  .edge-hint.right { right: 0; top: 0; bottom: 0; width: 4px; }
  .edge-hint.top { top: 0; left: 0; right: 0; height: 4px; }
  .edge-hint.bottom { bottom: 0; left: 0; right: 0; height: 4px; }
  .card {
    max-height: 72vh;
    display: flex; flex-direction: column;
    background: linear-gradient(160deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, 0) 40%), rgba(24, 26, 33, .7);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid rgba(255, 255, 255, .12); border-radius: 18px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 2px 0 rgba(255, 255, 255, .04) inset;
    cursor: grab; touch-action: none; user-select: none;
    animation: card-in .42s cubic-bezier(.2, 1.3, .4, 1) backwards;
    transition: background-color .15s;
  }
  .card.dragging { cursor: grabbing; }
  .card.bump { animation: card-bump .3s ease-out; }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line);
  }
  .card-title { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-status { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 99px; }
  .card-status.ok { color: var(--ok); background: rgba(123, 216, 143, .1); }
  .card-status.bad { color: var(--err); background: rgba(255, 107, 107, .1); }
  .card-x {
    width: 28px; height: 28px; padding: 0; border-radius: 50%;
    font-size: 18px; line-height: 1; color: var(--dim); background: transparent; border-color: transparent;
  }
  .card-x:hover { color: var(--ink); background: #2c313c; }
  .card-out {
    margin: 0; padding: 14px 16px; overflow: auto; flex: 1;
    font-family: var(--mono); font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink);
  }
  .card-out.err { color: var(--err); }
  .card-out .ln { animation: ln-in .28s ease-out both; }
  .card-out .quiet { color: var(--dim); font-style: italic; }
  .card-foot { padding: 6px 16px 10px; font-size: 11.5px; color: var(--dim); text-align: center; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(70px) scale(.9) rotate(-4deg); }
    to { opacity: 1; transform: none; }
  }
  @keyframes card-bump {
    40% { transform: scale(1.025) rotate(.6deg); }
  }
  @keyframes ln-in {
    from { opacity: 0; transform: translateY(5px); clip-path: inset(0 100% 0 0); }
    to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.bump, .card-out .ln, .mark.in .spear, .mark.in .shield { animation: none; }
  }
  code {
    font-family: var(--mono); font-size: .9em; color: var(--kw);
    background: rgba(255, 255, 255, .07); padding: 1px 5px; border-radius: 4px;
  }
  .prose code { background: rgba(255, 255, 255, .07); }
  footer {
    max-width: 1080px; margin: 0 auto 60px; padding: 14px 22px;
    color: var(--dim); font-size: 15px;
  }
  footer a { color: var(--accent); text-decoration: none; }

</style>
</head>
<body>
<header>
  <div id="mark" class="mark" role="img" aria-label="The Ares logo: a spear through a shield" title="again!"></div>
  <div class="title">
    <h1>Ares</h1>
    <p class="tag">effects in a functional style</p>
  </div>
  <a href="https://github.com/delyan-kirov/Ares" target="_blank" rel="noopener">source &rarr;</a>
</header>

<main>
  <p class="intro glass">
    Edit any example. <strong>Run</strong> (<code>&#8984;/Ctrl + Enter</code>)
    shows its output on a card: drag it to an edge to dock it, further to
    dismiss. Hover for types and errors; <code>Ctrl + Space</code> completes.
  </p>
  <div id="notebook"></div>
</main>

<footer class="glass">
  <span id="boot">Loading the compiler runtime&hellip;</span>
</footer>

<script type="module" src="main.js"></script>
</body>
</html>
