<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thrax, a tour</title>
<style>
  :root {
    --bg: #16181d; --panel: #1e2128; --card: #191c22; --ink: #e6e6e6;
    --dim: #8b93a1; --accent: #7cc4ff; --ok: #7bd88f; --err: #ff6b6b;
    --line: #2a2e37; --kw: #c8a6ff;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 22px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    max-width: 1080px; margin: 0 auto;
  }
  header h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  header .tag { color: var(--dim); font-size: 14px; }
  header a { color: var(--accent); text-decoration: none; font-size: 14px; margin-left: auto; }
  header a:hover { text-decoration: underline; }
  main { max-width: 1080px; margin: 0 auto; padding: 8px 20px 80px; }
  .intro { color: var(--dim); font-size: 15px; margin: 22px 2px 30px; max-width: 70ch; }
  .intro strong { color: var(--ink); font-weight: 600; }

  .cell { margin: 0 0 34px; }
  .cell .prose { margin: 0 2px 12px; }
  .cell .prose h2 {
    font-size: 16px; margin: 0 0 6px; letter-spacing: .3px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .cell .prose h2 .n {
    color: var(--dim); font-variant-numeric: tabular-nums;
    font-weight: 500; font-size: 13px;
  }
  .cell .prose p { margin: 0; color: var(--dim); max-width: 74ch; }

  .pane {
    display: flex; flex-direction: column; background: var(--card); min-width: 0;
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .bar {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .bar .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; }
  .bar .spacer { flex: 1; }
  button {
    font: inherit; font-size: 12.5px; color: var(--ink); background: #262a33;
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; cursor: pointer;
  }
  button.run { background: var(--accent); color: #0c1116; border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .ed-view, .ed-input {
    margin: 0; padding: 13px 14px; border: 0;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    background: transparent; color: var(--ink); tab-size: 4;
    font-variant-ligatures: none;
    white-space: pre-wrap; overflow-wrap: anywhere; word-break: normal;
  }

  /* The editor: a transparent textarea over a <pre> drawing the same text. */
  .ed { display: flex; flex-direction: column; min-width: 0; }
  .ed-inner { position: relative; }
  .ed-view { min-height: 64px; pointer-events: none; }
  .ed-input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    resize: none; outline: none; overflow: hidden;
    color: transparent; caret-color: var(--ink); -webkit-text-fill-color: transparent;
  }
  .ed-input::selection { background: #3a4a66; -webkit-text-fill-color: transparent; }
  .t-keyword { color: var(--kw); }
  .t-comment { color: #6c7686; font-style: italic; }
  .t-string { color: #a5d6a7; }
  .t-number { color: #f6c177; }
  .t-operator { color: #89ddff; }
  .t-type { color: #7cc4ff; }
  .t-function { color: #e6e6e6; }
  .t-macro { color: #ff9e64; }
  .d { text-decoration-line: underline; text-decoration-style: wavy; text-decoration-skip-ink: none;
       text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .d-error { text-decoration-color: var(--err); }
  .d-error.d-focus { text-decoration-thickness: 2px; background: rgba(255, 107, 107, .12); }
  .d-warning { text-decoration-color: #e5c07b; }
  .d-info { text-decoration-color: #6c9bd2; text-decoration-style: dotted; }
  .d-hint { text-decoration: none; }

  .ed-problems { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
  .ed-problems li {
    padding: 4px 14px; border-top: 1px solid var(--line); cursor: pointer;
    color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ed-problems li:hover { background: #20242c; }
  .ed-problems .p-error { color: var(--err); }
  .ed-problems .p-focus { font-weight: 600; }
  .ed-problems .p-warning { color: #e5c07b; }
  .ed-problems .p-at { font-family: var(--mono); color: var(--dim); font-weight: 400; margin-right: 6px; }
  .check { font-size: 11.5px; color: var(--dim); }
  .check.ok { color: var(--ok); }
  .check.bad { color: var(--err); }

  /* Hover and completion panels, positioned by the editor. */
  .float {
    position: fixed; z-index: 10; max-width: min(560px, calc(100vw - 16px));
    background: #232731; border: 1px solid #353b47; border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45); font-size: 13px;
  }
  .tip { padding: 8px 10px; }
  .tip pre { margin: 0; font-family: var(--mono); color: var(--accent); white-space: pre-wrap; }
  .tip p { margin: 6px 0 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12.5px; }
  .tip pre + p, .tip p:first-child { margin-top: 0; }
  .tip pre + p { margin-top: 8px; }
  .tip .m-error { color: var(--err); }
  .tip .m-warning { color: #e5c07b; }
  .tip .m-info { color: var(--dim); }
  .tip button { display: block; margin-top: 6px; text-align: left; }
  .complete { list-style: none; margin: 0; padding: 4px 0; max-height: 240px; overflow-y: auto; min-width: 220px; }
  .complete li {
    display: flex; gap: 14px; justify-content: space-between; padding: 2px 10px;
    font-family: var(--mono); font-size: 12.5px; cursor: pointer; white-space: nowrap;
  }
  .complete li b { font-weight: 500; color: var(--ink); }
  .complete li span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .complete li.sel { background: #2f3644; }

  /* Output cards, one per cell: dropped anywhere, docked at an edge, or thrown away. */
  .card-pos {
    position: fixed; left: 0; top: 0; z-index: 30;
    width: min(620px, calc(100vw - 24px));
  }
  .edge-hint { position: fixed; z-index: 29; pointer-events: none; opacity: 0;
    transition: opacity .15s, background-color .15s; background: var(--accent); }
  .edge-hint.on { opacity: .55; box-shadow: 0 0 24px 6px rgba(124, 196, 255, .35); }
  .edge-hint.out { background: var(--err); box-shadow: 0 0 24px 6px rgba(255, 107, 107, .4); }
  .edge-hint.left { left: 0; top: 0; bottom: 0; width: 4px; }
  .edge-hint.right { right: 0; top: 0; bottom: 0; width: 4px; }
  .edge-hint.top { top: 0; left: 0; right: 0; height: 4px; }
  .edge-hint.bottom { bottom: 0; left: 0; right: 0; height: 4px; }
  .card {
    max-height: 72vh;
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid #353b47; border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, .55), 0 2px 0 rgba(255, 255, 255, .04) inset;
    cursor: grab; touch-action: none; user-select: none;
    animation: card-in .42s cubic-bezier(.2, 1.3, .4, 1) backwards;
    transition: background-color .15s;
  }
  .card.dragging { cursor: grabbing; }
  .card.bump { animation: card-bump .3s ease-out; }
  .card-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 16px; border-bottom: 1px solid var(--line);
  }
  .card-title { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-status { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 99px; }
  .card-status.ok { color: var(--ok); background: rgba(123, 216, 143, .1); }
  .card-status.bad { color: var(--err); background: rgba(255, 107, 107, .1); }
  .card-x {
    width: 28px; height: 28px; padding: 0; border-radius: 50%;
    font-size: 18px; line-height: 1; color: var(--dim); background: transparent; border-color: transparent;
  }
  .card-x:hover { color: var(--ink); background: #2c313c; }
  .card-out {
    margin: 0; padding: 14px 16px; overflow: auto; flex: 1;
    font-family: var(--mono); font-size: 13px; line-height: 1.6;
    white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink);
  }
  .card-out.err { color: var(--err); }
  .card-out .ln { animation: ln-in .28s ease-out both; }
  .card-out .quiet { color: var(--dim); font-style: italic; }
  .card-foot { padding: 6px 16px 10px; font-size: 11.5px; color: var(--dim); text-align: center; }
  @keyframes card-in {
    from { opacity: 0; transform: translateY(70px) scale(.9) rotate(-4deg); }
    to { opacity: 1; transform: none; }
  }
  @keyframes card-bump {
    40% { transform: scale(1.025) rotate(.6deg); }
  }
  @keyframes ln-in {
    from { opacity: 0; transform: translateY(5px); clip-path: inset(0 100% 0 0); }
    to { opacity: 1; transform: none; clip-path: inset(0 0 0 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card.bump, .card-out .ln { animation: none; }
  }
  code {
    font-family: var(--mono); font-size: .9em; color: var(--kw);
    background: #21252e; padding: 1px 5px; border-radius: 4px;
  }
  .prose code { background: #20242c; }
  footer {
    max-width: 1080px; margin: 0 auto; padding: 0 22px 60px;
    color: var(--dim); font-size: 13px;
  }
  footer a { color: var(--accent); text-decoration: none; }

</style>
</head>
<body>
<header>
  <h1>Thrax</h1>
  <span class="tag">effects in a functional style</span>
  <a href="https://github.com/delyan-kirov/Thrax" target="_blank" rel="noopener">source &rarr;</a>
</header>

<main>
  <p class="intro">
    Edit any example. <strong>Run</strong> (<code>&#8984;/Ctrl + Enter</code>)
    shows its output on a card: drag it to an edge to dock it, further to
    dismiss. Hover for types and errors; <code>Ctrl + Space</code> completes.
  </p>
  <div id="notebook"></div>
</main>

<footer>
  <span id="boot">Loading the compiler runtime&hellip;</span>
</footer>

<script type="module" src="main.js"></script>
</body>
</html>
